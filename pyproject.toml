[project]
name = "feature-decoding"
version = "0.1.0"
description = "DNN feature decoding from fMRI brain activities (Horikawa & Kamitani, 2017)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "bdpy>=0.24",
    "fastl2lir",
    "hydra-core",
    "matplotlib",
    "numpy<2.0.0",
    "pyyaml",
    "scikit-learn",
    "tqdm",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The analysis scripts are top-level modules rather than an installed package,
# so the repository root has to be importable. `pythonpath` states that
# explicitly instead of relying on pytest's implicit rootdir insertion.
pythonpath = ["."]
markers = [
    "slow: tests that take more than a few seconds",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
